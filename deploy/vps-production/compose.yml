services:
  web:
    image: caddy:2
    container_name: rd-cafe-web
    restart: unless-stopped
    volumes:
      - ./current:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - edge
    depends_on:
      research:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  research:
    image: rd-cafe-research:${RELEASE_VERSION:?Set RELEASE_VERSION}
    build: ./research-server
    container_name: rd-cafe-research
    restart: unless-stopped
    env_file: ./research.env
    environment:
      RELEASE_VERSION: ${RELEASE_VERSION:?Set RELEASE_VERSION}
    volumes:
      - ./research-data:/data
    networks:
      - edge
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/api/research/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
networks:
  edge:
    external: true
    name: ffbsg_default
